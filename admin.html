<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Approval Panel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
    .btn-approve { background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-approve:hover { background: #218838; }
    .btn-refresh { background: #17a2b8; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; float: right; }
  </style>
</head>
<body>

  <div class="card">
    <button id="refresh-btn" class="btn-refresh">Refresh List</button>
    <h2>Admin - Pending Access Requests</h2>
    <p>Approve user payment transactions to grant 24-hour video access.</p>

    <div id="loading">Loading requests...</div>
    
    <table id="requests-table" style="display: none;">
      <thead>
        <tr>
          <th>User Email</th>
          <th>Video ID</th>
          <th>Txn ID / UTR</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, collectionGroup, getDocs, doc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loadingElem = document.getElementById("loading");
    const tableElem = document.getElementById("requests-table");
    const tableBody = document.getElementById("table-body");
    const refreshBtn = document.getElementById("refresh-btn");

    refreshBtn.addEventListener("click", loadPendingRequests);

    async function loadPendingRequests() {
      loadingElem.style.display = "block";
      tableElem.style.display = "none";
      tableBody.innerHTML = "";

      try {
        // Fetch all documents across all access subcollections directly
        const querySnapshot = await getDocs(collectionGroup(db, "access"));
        let pendingCount = 0;

        querySnapshot.forEach((documentSnap) => {
          const data = documentSnap.data();
          
          if (data.status === "pending") {
            pendingCount++;
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${data.userEmail || "Unknown User"}</td>
              <td>${data.videoId || documentSnap.id}</td>
              <td><strong>${data.txnId || "N/A"}</strong></td>
              <td>
                <button class="btn-approve" data-path="${documentSnap.ref.path}">Approve (Grant 24h)</button>
              </td>
            `;
            tableBody.appendChild(row);
          }
        });

        if (pendingCount === 0) {
          loadingElem.innerText = "No pending approval requests found.";
          return;
        }

        loadingElem.style.display = "none";
        tableElem.style.display = "table";

        document.querySelectorAll(".btn-approve").forEach(button => {
          button.addEventListener("click", async (e) => {
            const path = e.target.getAttribute("data-path");
            await approveRequest(path);
          });
        });

      } catch (err) {
        loadingElem.innerText = "Error loading requests: " + err.message;
      }
    }

    async function approveRequest(docPath) {
      try {
        const now = new Date();
        const expiresAt = new Date(now.getTime() + 24 * 60 * 60 * 1000);

        await updateDoc(doc(db, docPath), {
          status: "active",
          approvedAt: Timestamp.fromDate(now),
          expiresAt: Timestamp.fromDate(expiresAt)
        });

        alert("Access approved! 24-hour pass activated.");
        await loadPendingRequests();
      } catch (err) {
        alert("Failed to approve: " + err.message);
      }
    }

    loadPendingRequests();
  </script>
</body>
</html>
