<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Voice Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #e0f2fe, #f0fdf4, #fefce8);
}

.calculator {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(80, 100, 120, 0.18);
    border: 1px solid #e5e7eb;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.title {
    color: #1f2937;
    font-size: 23px;
}

.voice-btn {
    background: #e0f2fe;
    color: #0369a1;
    border: none;
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 16px;
}

.voice-btn:hover {
    background: #bae6fd;
}

.display {
    width: 100%;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    overflow-x: auto;
}

#expression {
    color: #64748b;
    min-height: 25px;
    text-align: right;
    font-size: 17px;
}

#result {
    color: #111827;
    min-height: 48px;
    text-align: right;
    font-size: 32px;
    font-weight: bold;
    margin-top: 5px;
}

.memory-buttons,
.buttons {
    display: grid;
    gap: 9px;
    margin-bottom: 10px;
}

.memory-buttons {
    grid-template-columns: repeat(4, 1fr);
}

.buttons {
    grid-template-columns: repeat(5, 1fr);
}

button {
    border: none;
    border-radius: 11px;
    min-height: 50px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    background: #f1f5f9;
    color: #334155;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.04);
    filter: brightness(0.96);
}

button:active {
    transform: scale(0.96);
}

.operator {
    background: #dbeafe;
    color: #1d4ed8;
}

.function {
    background: #f3e8ff;
    color: #7e22ce;
}

.special {
    background: #fee2e2;
    color: #dc2626;
}

.equal {
    background: #22c55e;
    color: white;
    grid-column: span 2;
}

.history {
    margin-top: 15px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 12px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    color: #334155;
}

.history-header button {
    min-height: auto;
    padding: 6px 10px;
    font-size: 12px;
    background: #fee2e2;
    color: #dc2626;
}

#historyList {
    max-height: 150px;
    overflow-y: auto;
    font-size: 14px;
}

.history-item {
    padding: 9px;
    border-bottom: 1px solid #e2e8f0;
    color: #475569;
    cursor: pointer;
}

.history-item:hover {
    background: #e0f2fe;
}

@media (max-width: 450px) {

    body {
        padding: 10px;
    }

    .calculator {
        padding: 13px;
    }

    button {
        min-height: 46px;
        font-size: 13px;
    }

    #result {
        font-size: 27px;
    }

    .title {
        font-size: 19px;
    }
}
</style>

</head>

<body>

<div class="calculator">

```
<div class="top-bar">
    <h1 class="title">Advanced Calculator</h1>

    <button class="voice-btn" onclick="toggleVoice()" id="voiceButton">
        🔊 Voice ON
    </button>
</div>

<div class="display">
    <div id="expression"></div>
    <div id="result">0</div>
</div>

<!-- Memory -->
<div class="memory-buttons">
    <button onclick="memoryClear()">MC</button>
    <button onclick="memoryRecall()">MR</button>
    <button onclick="memoryAdd()">M+</button>
    <button onclick="memorySubtract()">M−</button>
</div>

<!-- Buttons -->
<div class="buttons">

    <button class="special" onclick="clearAll()">AC</button>
    <button class="special" onclick="deleteLast()">DEL</button>
    <button class="function" onclick="addToExpression('(')">(</button>
    <button class="function" onclick="addToExpression(')')">)</button>
    <button class="operator" onclick="addToExpression('/')">÷</button>

    <button class="function" onclick="addFunction('sin(')">sin</button>
    <button class="function" onclick="addFunction('cos(')">cos</button>
    <button class="function" onclick="addFunction('tan(')">tan</button>
    <button class="function" onclick="addFunction('log(')">log</button>
    <button class="function" onclick="addFunction('ln(')">ln</button>

    <button class="function" onclick="addFunction('sqrt(')">√</button>
    <button class="function" onclick="addToExpression('^')">xʸ</button>
    <button class="function" onclick="addFactorial()">x!</button>
    <button class="function" onclick="addToExpression('Math.PI')">π</button>
    <button class="function" onclick="addToExpression('Math.E')">e</button>

    <button onclick="addToExpression('7')">7</button>
    <button onclick="addToExpression('8')">8</button>
    <button onclick="addToExpression('9')">9</button>
    <button class="operator" onclick="addToExpression('*')">×</button>
    <button class="operator" onclick="addToExpression('%')">%</button>

    <button onclick="addToExpression('4')">4</button>
    <button onclick="addToExpression('5')">5</button>
    <button onclick="addToExpression('6')">6</button>
    <button class="operator" onclick="addToExpression('-')">−</button>
    <button class="function" onclick="addToExpression('^2')">x²</button>

    <button onclick="addToExpression('1')">1</button>
    <button onclick="addToExpression('2')">2</button>
    <button onclick="addToExpression('3')">3</button>
    <button class="operator" onclick="addToExpression('+')">+</button>
    <button class="function" onclick="calculatePercent()">%</button>

    <button onclick="addToExpression('0')">0</button>
    <button onclick="addToExpression('.')">.</button>
    <button onclick="changeSign()">±</button>
    <button class="equal" onclick="calculate()">=</button>

</div>

<div class="history">

</div>
```

</div>

<script>

let expression = "";
let memory = 0;
let voiceEnabled = true;

const expressionDisplay = document.getElementById("expression");
const resultDisplay = document.getElementById("result");
const historyList = document.getElementById("historyList");
const voiceButton = document.getElementById("voiceButton");


/* =========================
   VOICE SYSTEM
========================= */

function speak(text) {

    if (!voiceEnabled) return;

    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    let speech = new SpeechSynthesisUtterance(text);

    speech.rate = 0.9;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


function toggleVoice() {

    voiceEnabled = !voiceEnabled;

    window.speechSynthesis.cancel();

    if (voiceEnabled) {

        voiceButton.innerHTML = "🔊 Voice ON";
        speak("Voice enabled");

    } else {

        voiceButton.innerHTML = "🔇 Voice OFF";

    }
}


/* =========================
   DISPLAY
========================= */

function updateDisplay() {

    expressionDisplay.textContent = expression
        .replaceAll("Math.PI", "π")
        .replaceAll("Math.E", "e")
        .replaceAll("*", "×")
        .replaceAll("/", "÷")
        .replaceAll("sqrt", "√");

    if (expression === "") {
        resultDisplay.textContent = "0";
    }
}


/* =========================
   INPUT VOICE
========================= */

function getVoiceName(value) {

    const voiceNames = {

        "+": "plus",
        "-": "minus",
        "*": "multiply",
        "/": "divide",
        ".": "point",
        "(": "open bracket",
        ")": "close bracket",
        "%": "percent",
        "^": "power",
        "Math.PI": "pi",
        "Math.E": "e"

    };

    return voiceNames[value] || value;
}


/* =========================
   CALCULATOR INPUT
========================= */

function addToExpression(value) {

    expression += value;

    speak(getVoiceName(value));

    updateDisplay();
}


function addFunction(func) {

    expression += func;

    let name = func.replace("(", "");

    const names = {
        "sin": "sine",
        "cos": "cosine",
        "tan": "tangent",
        "log": "logarithm",
        "ln": "natural logarithm",
        "sqrt": "square root"
    };

    speak(names[name] || name);

    updateDisplay();
}


function clearAll() {

    expression = "";

    resultDisplay.textContent = "0";

    speak("All clear");

    updateDisplay();
}


function deleteLast() {

    expression = expression.slice(0, -1);

    speak("Delete");

    updateDisplay();
}


/* =========================
   FACTORIAL
========================= */

function factorial(n) {

    n = Number(n);

    if (n < 0 || !Number.isInteger(n)) {
        throw new Error("Invalid factorial");
    }

    let result = 1;

    for (let i = 2; i <= n; i++) {
        result *= i;
    }

    return result;
}


function addFactorial() {

    if (expression !== "") {

        expression += "!";

        speak("factorial");

        updateDisplay();

    }
}


/* =========================
   PREPARE CALCULATION
========================= */

function prepareExpression(exp) {

    exp = exp.replace(/\^/g, "**");

    exp = exp.replace(/sqrt\(/g, "Math.sqrt(");
    exp = exp.replace(/sin\(/g, "Math.sin(");
    exp = exp.replace(/cos\(/g, "Math.cos(");
    exp = exp.replace(/tan\(/g, "Math.tan(");
    exp = exp.replace(/log\(/g, "Math.log10(");
    exp = exp.replace(/ln\(/g, "Math.log(");

    exp = exp.replace(/(\d+)!/g, "factorial($1)");

    return exp;
}


/* =========================
   CALCULATE
========================= */

function calculate() {

    if (expression === "") return;

    try {

        let prepared = prepareExpression(expression);

        let answer = Function(
            "factorial",
            "return (" + prepared + ")"
        )(factorial);

        if (!Number.isFinite(answer)) {
            throw new Error();
        }

        answer = Number(answer.toFixed(10));

        resultDisplay.textContent = answer;

        speak("The answer is " + answer);

        addHistory(expressionDisplay.textContent, answer);

        expression = String(answer);

    }

    catch (error) {

        resultDisplay.textContent = "Error";

        speak("Calculation error");

    }
}


/* =========================
   PERCENT
========================= */

function calculatePercent() {

    try {

        if (expression !== "") {

            let prepared = prepareExpression(expression);

            let value = Function(
                "factorial",
                "return (" + prepared + ")"
            )(factorial);

            expression = String(value / 100);

            resultDisplay.textContent = expression;

            speak("The answer is " + expression);

        }

    }

    catch {

        resultDisplay.textContent = "Error";

        speak("Calculation error");

    }
}


/* =========================
   CHANGE SIGN
========================= */

function changeSign() {

    if (expression === "") return;

    expression = "-(" + expression + ")";

    speak("Change sign");

    updateDisplay();
}


/* =========================
   MEMORY
========================= */

function memoryClear() {

    memory = 0;

    speak("Memory cleared");

}


function memoryRecall() {

    expression += memory;

    speak("Memory recall " + memory);

    updateDisplay();

}


function memoryAdd() {

    let value = Number(resultDisplay.textContent);

    if (!isNaN(value)) {

        memory += value;

        speak("Added to memory");

    }
}


function memorySubtract() {

    let value = Number(resultDisplay.textContent);

    if (!isNaN(value)) {

        memory -= value;

        speak("Subtracted from memory");

    }
}


/* =========================
   HISTORY
========================= */

function addHistory(exp, answer) {

    let item = document.createElement("div");

    item.className = "history-item";

    item.textContent = exp + " = " + answer;

    item.onclick = function() {

        expression = String(answer);

        resultDisplay.textContent = answer;

        speak("Selected result " + answer);

        updateDisplay();

    };

    historyList.prepend(item);
}


function clearHistory() {

    historyList.innerHTML = "";

    speak("History cleared");

}


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener("keydown", function(event) {

    const key = event.key;

    if ("0123456789.+-*/()".includes(key)) {

        addToExpression(key);

    }

    else if (key === "Enter" || key === "=") {

        event.preventDefault();

        calculate();

    }

    else if (key === "Backspace") {

        deleteLast();

    }

    else if (key === "Escape") {

        clearAll();

    }

});

</script>

</body>
</html>
