<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Dashboard</title>
</head>
<body>
  <h2>Available Videos</h2>
  <div id="video-container"></div>

  <!-- Type="module" allows ES6 module imports like firebase-config.js -->
  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { monitorAuthState } from "./auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Redirect to login if user isn't logged in
    monitorAuthState(
      (user) => {
        loadVideosForUser(user.uid);
      },
      () => {
        window.location.href = "index.html";
      }
    );

    async function loadVideosForUser(userId) {
      const videoId = "sample_video_1";
      const container = document.getElementById("video-container");

      // Check if user has an active 24-hour access pass in Firestore
      const accessRef = doc(db, "users", userId, "access", videoId);
      const accessSnap = await getDoc(accessRef);

      let hasAccess = false;
      if (accessSnap.exists()) {
        const data = accessSnap.data();
        const now = new Date();
        const expiresAt = data.expiresAt.toDate();
        if (now < expiresAt) {
          hasAccess = true;
        }
      }

      if (hasAccess) {
        // Show FULL YouTube Video (Replace YOUTUBE_VIDEO_ID with your video ID)
        container.innerHTML = `
          <h3>Full Access Unlocked</h3>
          <iframe width="560" height="315" 
                  src="https://www.youtube.com/embed/YOUTUBE_VIDEO_ID?autoplay=1" 
                  frameborder="0" allowfullscreen>
          </iframe>
        `;
      } else {
        // Show Template / Preview Only + Unlock Button
        container.innerHTML = `
          <h3>Video Template (Preview)</h3>
          <p>Pay ₹10 to unlock 24-hour full access to this video.</p>
          <button id="pay-button">Unlock Full Video (₹10 for 24 hours)</button>
        `;

        document.getElementById("pay-button").addEventListener("click", () => {
          alert("Payment gateway needed here to set the 24-hour pass in Firestore.");
        });
      }
    }
  </script>
</body>
</html>
